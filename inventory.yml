---
all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: /root/.ssh/ansible_home
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3

  children:
    application_servers:
      hosts:
        panther:
          ansible_host: 192.168.1.204
        web01:
          ansible_host: 192.168.1.182
        splunk:
          ansible_host: 192.168.1.13
        toolkit:
          ansible_host: 192.168.1.185
        turtle:
          ansible_host: 192.168.1.197
        nagios:
          ansible_host: 192.168.1.223

    infrastructure_servers:
      hosts:
        homebridge:
          ansible_host: 192.168.1.11
        pihole:
          ansible_host: 192.168.1.53

    controller:
      hosts:
        saturn:
          ansible_connection: local
          ansible_host: 127.0.0.1
